<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Theo dõi đơn hàng</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="phone-frame">
    <div class="map-area">
      <div id="map"></div>

      <!-- ETA Card -->
      <div class="eta-card" id="eta-card">
        <div class="eta-loading" id="eta-loading">
          <div class="eta-loading-spinner"></div>
          <span>Đang tải thông tin...</span>
        </div>
        <div class="eta-content" id="eta-content" style="display:none">
          <div class="eta-row">
            <div class="eta-main">
              <p class="eta-label" id="eta-label">Dự kiến giao hàng trong</p>
              <p class="eta-value"><span id="eta-minutes">--</span> <span class="eta-unit">Phút</span></p>
            </div>
            <div class="eta-traveled">
              <p class="traveled-label">Đã đi</p>
              <p class="traveled-value"><span id="traveled-distance">0.0</span> km</p>
            </div>
          </div>
          <div class="eta-progress"><div class="eta-progress-bar" id="eta-bar"></div></div>
        </div>
      </div>

      <!-- Connection status badge -->
      <div id="connection-badge" class="connection-badge">
        <span id="connection-dot" class="connection-dot offline"></span>
        <span id="connection-text">Đang kết nối...</span>
      </div>
    </div>

    <div class="bottom-sheet">
      <div class="sheet-handle"></div>

      <div class="order-header">
        <p class="order-badge" id="order-id">#ORD-...</p>
        <span class="order-status-badge" id="order-status-badge"></span>
      </div>

      <div class="driver-card">
        <div class="driver-avatar">
          <img id="driver-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Driver" alt="Driver">
        </div>
        <div class="driver-info">
          <h3 id="driver-name" class="driver-name">Đang tải...</h3>
          <p id="driver-vehicle" class="driver-vehicle">--</p>
        </div>
      </div>

      <div class="status-steps" id="status-steps">
        <div class="step-item" data-status="pending">
          <div class="step-dot"></div>
          <div class="step-info">
            <span class="step-title">Chờ xác nhận</span>
          </div>
        </div>
        <div class="step-item" data-status="pickup">
          <div class="step-line"></div>
          <div class="step-dot"></div>
          <div class="step-info">
            <span class="step-title">Đang lấy hàng</span>
          </div>
        </div>
        <div class="step-item" data-status="delivering">
          <div class="step-line"></div>
          <div class="step-dot"></div>
          <div class="step-info">
            <span class="step-title">Đang giao hàng</span>
          </div>
        </div>
        <div class="step-item" data-status="completed">
          <div class="step-line"></div>
          <div class="step-dot"></div>
          <div class="step-info">
            <span class="step-title">Giao thành công</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="./js/map.js"></script>
  <script src="./js/socket.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
