<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Theo dõi đơn hàng</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="phone-frame">
    <!-- MAP (nền chính, chiếm toàn bộ màn hình) -->
    <div class="map-area">
      <div id="map"></div>

      <!-- Chấm kết nối realtime, nổi nhẹ góc trên phải -->
      <span id="connection-dot" class="connection-dot offline" title="Trạng thái kết nối"></span>

      <!-- Card ETA nổi trên map -->
      <div class="eta-card" id="eta-card">
        <div class="eta-loading" id="eta-loading">
          <div class="eta-loading-spinner"></div>
          <span>Đang tải thông tin...</span>
        </div>
        <div class="eta-content" id="eta-content" style="display:none">
          <h2 class="eta-title" id="eta-label">Dự kiến giao hàng trong</h2>
          <p class="eta-value"><span id="eta-minutes">--</span> <span class="eta-unit">Phút</span></p>
          <div class="eta-progress"><div class="eta-progress-bar" id="eta-bar"></div></div>
        </div>
      </div>
    </div>

    <!-- Card thông tin đơn hàng, nổi ở dưới cùng -->
    <div class="bottom-card">
      <div class="sheet-handle"></div>

      <div class="order-row">
        <p class="order-label" id="order-id">Đơn hàng #...</p>
        <span class="order-status-badge" id="order-status-badge">Đang tải</span>
      </div>

      <div class="driver-row">
        <div class="driver-avatar">
          <img id="driver-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Driver" alt="Driver">
        </div>
        <div class="driver-info">
          <h3 id="driver-name">Đang tải...</h3>
          <p id="driver-vehicle">--</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    window.__API_BASE_URL__ = 'https://last-mile-delivery-l7y0.onrender.com/api';
    window.__SOCKET_URL__ = 'https://last-mile-delivery-l7y0.onrender.com';
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script type="module" src="./js/socket.js"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
