services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: lmd-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: last_mile_delivery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lmd-network

  # Redis lưu trữ tọa độ Real-time
  redis:
    image: redis:7-alpine
    container_name: lmd-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - lmd-network

volumes:
  pgdata:
  redisdata:

networks:
  lmd-network:
    driver: bridge
